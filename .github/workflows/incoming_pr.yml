name: Incoming PR
run-name: PR opened by ${{ github.actor }}

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read

jobs:
  run-snowflake-test-dbt-job:
    name: "Run on Incoming PR"
    runs-on: ubuntu-latest
    environment: prod
    env:
      SNOWFLAKE_CLI_FEATURES_ENABLE_DBT: true
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_SCHEMA: ${{ vars.SNOWFLAKE_SCHEMA }}
      SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
      # secrets can't be used in step-level `if:` -> expose a boolean instead
      HAS_ICEBERG_READER_KEY: ${{ secrets.ICEBERG_READER_PRIVATE_KEY != '' }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Install Snowflake CLI
        uses: snowflakedb/snowflake-cli-action@v2.0

      - name: Check Snowflake CLI Version
        run: snow --version

      - name: Test Snowflake Connection
        run: snow connection test -x

      - name: Create a tester dbt project object
        run: snow dbt deploy demosnowdbt_tester_gh_action --source ./demosnowdbt --force -x

      - name: List all dbt project objects
        run: snow dbt list -x

      - name: Load seed data on tester project
        run: snow dbt execute -x demosnowdbt_tester_gh_action seed --target dev

      - name: Execute dbt run on tester project
        run: snow dbt execute -x demosnowdbt_tester_gh_action run --target dev

      - name: Execute dbt test on tester project
        run: snow dbt execute -x demosnowdbt_tester_gh_action test --target dev

      # Proof of openness : read the Iceberg tables dbt just built from OUTSIDE
      # Snowflake (PyIceberg + DuckDB through the Horizon Iceberg REST catalog).
      # Skipped if the ICEBERG_READER_PRIVATE_KEY secret isn't configured.
      - name: Set up Python
        if: env.HAS_ICEBERG_READER_KEY == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read Iceberg tables from an external engine
        if: env.HAS_ICEBERG_READER_KEY == 'true'
        env:
          ICEBERG_READER_PRIVATE_KEY: ${{ secrets.ICEBERG_READER_PRIVATE_KEY }}
          ICEBERG_DATABASE: DBT_DEV_DB
          ICEBERG_SCHEMA: DBT_SCHEMA
        run: |
          pip install "pyiceberg[pyarrow,duckdb]==0.12.*" pyjwt cryptography
          python scripts/read_iceberg_from_outside.py
