name: demosnowdbt
version: 1.0.0
config-version: 2
profile: demosnowdbt

model-paths:
  - models
analysis-paths:
  - analyses
test-paths:
  - tests
seed-paths:
  - seeds
macro-paths:
  - macros
snapshot-paths:
  - snapshots

models:
  demosnowdbt:
    staging:
      +materialized: view
    marts:
      +materialized: table
    semantics:
      # sem_* models set materialized='semantic_view' in their config block ;
      # anything else in this folder defaults to table (e.g. rpt_ consumers)
      +materialized: table
